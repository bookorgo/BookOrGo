name: BookOrGo P1 quality audit
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/quality-audit.yml', '.github/scripts/quality-audit.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookorgo-source-quality
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, dom, xml, curl, zip, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build database-independent CI source
        working-directory: site
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
          npm run build
          cp .env.example .env
          printf '\nAPP_ENV=testing\nAPP_URL=http://127.0.0.1:8000\nSESSION_SECURE_COOKIE=false\n' >> .env
          php artisan key:generate --ansi
      - name: Install pinned audit dependencies
        run: |
          npm install --prefix /tmp/bookorgo-quality --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          /tmp/bookorgo-quality/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Functional and accessibility checks against frozen CI source
        env:
          BOOKORGO_AUDIT_ORIGIN: http://127.0.0.1:8000
          BOOKORGO_REQUIRE_CLEAN_A11Y: 'true'
        run: |
          php site/artisan serve --host=127.0.0.1 --port=8000 > /tmp/bookorgo-quality-app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/quality-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookorgo-quality-${{ github.sha }}
          path: site/test-results/quality/
          retention-days: 14
          if-no-files-found: warn
