name: Hostinger read-only preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-preflight.yml']
permissions: {}
concurrency:
  group: hostinger-read-only-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check runtime over verified SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing HOSTINGER_SSH_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing HOSTINGER_KNOWN_HOSTS"; exit 1; }
          umask 077
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p 65002 -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" u809119518@45.137.159.248 'bash -s' <<'REMOTE'
          set -eu
          /opt/alt/php84/usr/bin/php -v
          /opt/alt/php84/usr/bin/php -m
          /opt/alt/php84/usr/bin/php -r '$required = ["ctype","curl","dom","fileinfo","filter","hash","mbstring","openssl","pcre","PDO","session","tokenizer","xml","pdo_mysql","intl","zip"]; $missing = array_values(array_filter($required, fn($e) => !extension_loaded($e))); echo json_encode(["php"=>PHP_VERSION,"missing_extensions"=>$missing,"memory_limit"=>ini_get("memory_limit")]), PHP_EOL; exit(count($missing) ? 1 : 0);'
          /opt/alt/php84/usr/bin/php /usr/local/bin/composer --version
          for tool in git tar unzip node npm mysql mariadb mysqldump crontab; do
            if command -v "$tool" >/dev/null 2>&1; then echo "$tool: available"; else echo "$tool: not found"; fi
          done
          test -w "$HOME/domains/bookorgo.com/public_html" && echo "document_root_writable: yes"
          ls -ld "$HOME/domains/bookorgo.com/public_html"
          /opt/alt/php84/usr/bin/php <<'PHP'
          <?php
          $root = getenv('HOME') . '/domains/bookorgo.com/public_html';
          $items = array_values(array_diff(scandir($root), ['.', '..']));
          $files = $dirs = $links = 0;
          foreach ($items as $item) {
              $path = $root . '/' . $item;
              if (is_link($path)) { $links++; }
              elseif (is_dir($path)) { $dirs++; }
              elseif (is_file($path)) { $files++; }
          }
          $markers = [];
          foreach (['index.php','index.html','default.php','artisan','composer.json','wp-config.php'] as $name) {
              $markers[$name] = file_exists($root . '/' . $name);
          }
          echo 'HOST_BASELINE_JSON=', json_encode([
              'scope'=>'BookOrGo public_html top-level metadata only',
              'root_is_symlink'=>is_link($root),
              'files'=>$files, 'directories'=>$dirs, 'symlinks'=>$links,
              'markers'=>$markers,
              'limits'=>['No existing file contents read','No recursive scan','No changes']
          ]), PHP_EOL;
          PHP
          REMOTE
      - name: Capture bounded public URL baseline
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urljoin, urlsplit
          from urllib.error import HTTPError
          
          ORIGIN = "https://bookorgo.com"
          class SameOriginRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlsplit(newurl).netloc != "bookorgo.com" or urlsplit(newurl).scheme != "https":
                      raise ValueError("Redirect outside approved HTTPS origin")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener = build_opener(SameOriginRedirect)
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links, self.canonicals, self.robots = [], [], []
                  self.h1_count = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "h1": self.h1_count += 1
                  if tag == "a" and a.get("href"): self.links.append(a["href"])
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonicals.append(a.get("href", ""))
                  if tag == "meta" and a.get("name", "").lower() in ("robots","googlebot"):
                      self.robots.append(a.get("content", ""))
          def inspect(path):
              url = ORIGIN + path
              row = {"path": path}
              try:
                  try:
                      response = opener.open(Request(url, headers={"User-Agent":"BookOrGoOwnerReadOnlyAudit/1.0"}), timeout=20)
                  except HTTPError as e:
                      response = e
                  with response:
                      data = response.read(2_000_001)
                      row.update(status=response.code, final_url=response.geturl(),
                                 content_type=response.headers.get("Content-Type",""),
                                 x_robots_tag=response.headers.get("X-Robots-Tag",""),
                                 truncated=len(data)>2_000_000)
                  if row["truncated"]: raise ValueError("Response exceeded bounded read")
                  row["sha256"] = hashlib.sha256(data).hexdigest()
                  page = Page()
                  if "text/html" in row["content_type"]:
                      page.feed(data.decode("utf-8","replace"))
                      row.update(h1_count=page.h1_count, canonicals=page.canonicals, robots=page.robots)
                  links = []
                  for href in page.links:
                      u = urlsplit(urljoin(url, href))
                      if u.scheme=="https" and u.netloc=="bookorgo.com" and not u.query and not u.fragment:
                          if u.path.startswith(("/activities","/holidays","/visas","/cruises","/yachts","/events","/blog")):
                              links.append(u.path or "/")
                  return row, sorted(set(links))
              except Exception as e:
                  row["error"] = type(e).__name__
                  return row, []
          home, paths = inspect("/")
          selected = ["/robots.txt", "/sitemap.xml"] + paths[:18]
          rows = [home]
          for path in dict.fromkeys(selected):
              row, _ = inspect(path)
              rows.append(row)
          report = {"task":"P0-L01a","checked_at":datetime.now(timezone.utc).isoformat(),
                    "scope":"homepage, robots/sitemap and at most 18 clean category/detail/blog links discovered on homepage",
                    "discovered_paths":paths, "results":rows,
                    "limits":["No external or affiliate link requests","No browser/visual check","Not an exhaustive crawl","No mutation"]}
          print("PUBLIC_BASELINE_JSON="+json.dumps(report, separators=(",",":")))
          if any("error" in r for r in rows):
              raise SystemExit("Incomplete baseline: inspect per-path errors")
          PY
