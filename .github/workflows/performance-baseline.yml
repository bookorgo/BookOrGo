name: BookOrGo P1 performance baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/performance-baseline.yml', '.github/scripts/performance-*.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookorgo-live-performance
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test measurement aggregation
        run: node --test .github/scripts/performance-summary.test.mjs .github/scripts/performance-comparison.test.mjs
      - name: Install pinned lab tools
        run: |
          npm install --prefix /tmp/bookorgo-performance --no-save --package-lock=false lighthouse@12.8.2 playwright@1.56.1
          /tmp/bookorgo-performance/node_modules/.bin/playwright install --with-deps chromium
      - name: Measure four live templates, three repeats, mobile and desktop
        run: node .github/scripts/performance-baseline.mjs
      - name: Compare with P1-05f using matching measurement settings
        run: node .github/scripts/performance-comparison.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookorgo-performance-${{ github.sha }}
          path: site/test-results/performance/
          retention-days: 30
          if-no-files-found: warn
