name: BookOrGo bounded LCP traces
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lcp-trace.yml', '.github/scripts/lcp-trace*.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookorgo-live-performance
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test trace safety and completeness
        run: node --test .github/scripts/lcp-trace-utils.test.mjs
      - name: Install pinned browser
        run: |
          npm install --prefix /tmp/bookorgo-trace --no-save --package-lock=false playwright@1.56.1
          /tmp/bookorgo-trace/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture exactly six read-only navigations
        run: node .github/scripts/lcp-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookorgo-lcp-traces-${{ github.sha }}
          path: site/test-results/lcp-trace/
          retention-days: 30
          if-no-files-found: warn
